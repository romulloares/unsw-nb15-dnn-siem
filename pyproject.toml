[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "unsw-nb15-dnn-siem"
version = "0.1.0"
description = "Classificação binária de intrusão no UNSW-NB15 com baselines e DNN."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
